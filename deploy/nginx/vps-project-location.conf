# Add these location blocks inside your existing HTTPS server block.
# They only claim /project and /project/api, leaving /content and /api untouched.

location = /project {
  return 301 /project/;
}

location /project/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_pass http://127.0.0.1:8081/project/;
}
